name: Control plane tools

on:
  pull_request:
    paths:
      - 'tools/control-plane/**'
      - '.github/workflows/control-plane-tools.yml'
  push:
    paths:
      - 'tools/control-plane/**'
      - '.github/workflows/control-plane-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tools/control-plane -p 'test_*.py' -v
      - name: Syntax check
        run: python3 -m py_compile tools/control-plane/server.py tools/control-plane/test_server.py
