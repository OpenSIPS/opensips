name: Sync Coverity branch

on:
  # 18:00 UTC every Sunday (20:00 CET / 21:00 CEST).
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-coverity
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.COVERITY_SYNC_TOKEN }}

      - name: Merge master into coverity_scan
        run: |
          git config user.name 'OpenSIPS Coverity Bot'
          git config user.email 'coverity-sync-bot@opensips.org'
          git fetch origin master coverity_scan
          git switch coverity_scan
          git merge --no-edit origin/master
          git push origin HEAD:coverity_scan
