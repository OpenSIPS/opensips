name: Media impairment tools

on:
  pull_request:
    paths:
      - 'tools/media-impairment/**'
      - '.github/workflows/media-impairment-tools.yml'
  push:
    paths:
      - 'tools/media-impairment/**'
      - '.github/workflows/media-impairment-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  command-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test netem command generation
        run: python3 -m unittest discover -s tools/media-impairment -p 'test_*.py' -v
      - name: Exercise dry-run profile
        run: python3 tools/media-impairment/impair.py --dry-run -i eth0 apply --profile bad-mobile
