# Minimal localhost, stateful UDP proxy for transaction race regressions.
log_level=3
socket=udp:127.0.0.1:5062
loadmodule "proto_udp.so"
loadmodule "tm.so"
loadmodule "sl.so"

route {
    if (is_method("CANCEL")) {
        if (t_check_trans())
            t_relay();
        exit;
    }
    if (!t_relay()) {
        sl_send_reply(500, "Relay Failed");
    }
    exit;
}
