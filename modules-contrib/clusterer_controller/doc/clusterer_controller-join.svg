<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1218" viewBox="0 0 1240 1218">
<defs><marker id="a-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b6fd8"/></marker><marker id="s-ctl" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#3b6fd8"/></marker><marker id="a-bin" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c9781b"/></marker><marker id="s-bin" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c9781b"/></marker><marker id="a-mst" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a4bc2"/></marker><marker id="s-mst" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#7a4bc2"/></marker><marker id="a-bad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c43c3c"/></marker><marker id="s-bad" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#c43c3c"/></marker><marker id="a-gry" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/></marker><marker id="s-gry" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#6b7280"/></marker><marker id="a-st" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111827"/></marker><marker id="s-st" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#111827"/></marker></defs>
<style>
text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
.h1 { font-size: 22px; font-weight: 700; fill: #111827; }
.sub { font-size: 13px; fill: #4b5563; }
.st { font-size: 15px; font-weight: 700; fill: #111827; }
.bt { font-size: 13.5px; font-weight: 700; }
.b { font-size: 13px; fill: #1f2937; }
.ml { font-size: 13px; font-weight: 600; }
.ms { font-size: 12px; }
</style>
<rect width="1240" height="1218" fill="#ffffff"/>
<text x="24" y="40" class="h1" text-anchor="start">clusterer_controller: a node joining a controller-managed cluster</text>
<text x="24" y="64" class="sub" text-anchor="start">Control messages travel on the cluster's multicast group and port, unicast where marked; BIN links are TCP.</text>
<text x="24" y="82" class="sub" text-anchor="start">Bootstrap key = Argon2id(password); session key = HKDF(password, master_salt).</text>
<rect x="80" y="106" width="180" height="34" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<text x="170" y="128" class="st" text-anchor="middle">Joiner</text>
<rect x="520" y="106" width="180" height="34" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<text x="610" y="128" class="st" text-anchor="middle">Master</text>
<rect x="950" y="106" width="180" height="34" rx="8" fill="#ffffff" stroke="#111827" stroke-width="2"/>
<text x="1040" y="128" class="st" text-anchor="middle">Other members</text>
<line x1="170" y1="140" x2="170" y2="1198" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 4"/>
<line x1="610" y1="140" x2="610" y2="1198" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 4"/>
<line x1="1040" y1="140" x2="1040" y2="1198" stroke="#9ca3af" stroke-width="1.4" stroke-dasharray="4 4"/>
<line x1="170" y1="176" x2="602" y2="176" stroke="#3b6fd8" stroke-width="1.8" marker-end="url(#a-ctl)"/>
<text x="390.0" y="153" class="ml" fill="#3b6fd8" text-anchor="middle">JOIN_REQ: Noise_NNpsk0 first message, capabilities,</text>
<text x="390.0" y="168" class="ml" fill="#3b6fd8" text-anchor="middle">MTU, settings, proposed node id</text>
<text x="390.0" y="192" class="ms" fill="#4b5563" text-anchor="middle">multicast, bootstrap key - sent again until answered</text>
<line x1="170" y1="176" x2="1032" y2="176" stroke="#3b6fd8" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-ctl)"/>
<text x="605.0" y="168" class="ml" fill="#3b6fd8" text-anchor="middle"></text>
<rect x="410" y="210" width="400" height="141" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/>
<text x="419" y="228" class="bt" fill="#6b7280" text-anchor="start">The master checks it</text>
<text x="419" y="249" class="b" text-anchor="start">Password (the packet must open with the bootstrap</text>
<text x="419" y="266" class="b" text-anchor="start">key), MTU and the on_config_mismatch settings. Then</text>
<text x="419" y="283" class="b" text-anchor="start">the admission gate: is a member unheard, the</text>
<text x="419" y="300" class="b" text-anchor="start">mastership unconfirmed, a joiner stuck (and not yet</text>
<text x="419" y="317" class="b" text-anchor="start">parked), or this joiner's place past the batch (1</text>
<text x="419" y="334" class="b" text-anchor="start">at a time under 16 live members, 4 from 16)?</text>
<line x1="610" y1="397" x2="178" y2="397" stroke="#3b6fd8" stroke-width="1.8" marker-end="url(#a-ctl)"/>
<text x="390.0" y="389" class="ml" fill="#3b6fd8" text-anchor="middle">JOIN_WAIT (place, length) - when the gate says wait</text>
<text x="390.0" y="413" class="ms" fill="#4b5563" text-anchor="middle">unicast, bootstrap key, echoes its nonce; it asks again after 3 s</text>
<line x1="610" y1="453" x2="178" y2="453" stroke="#7a4bc2" stroke-width="1.8" marker-end="url(#a-mst)"/>
<text x="390.0" y="445" class="ml" fill="#7a4bc2" text-anchor="middle">KEY_GRANT: the Noise answer, carrying master_salt</text>
<text x="390.0" y="469" class="ms" fill="#4b5563" text-anchor="middle">unicast, bootstrap key - the joiner now has the session key</text>
<line x1="610" y1="505" x2="1032" y2="505" stroke="#7a4bc2" stroke-width="1.8" marker-end="url(#a-mst)"/>
<text x="825.0" y="497" class="ml" fill="#7a4bc2" text-anchor="middle">NODE_ASSIGN: the joiner's node id and BIN address</text>
<text x="825.0" y="521" class="ms" fill="#4b5563" text-anchor="middle">multicast, session key - every member learns it</text>
<line x1="610" y1="505" x2="178" y2="505" stroke="#7a4bc2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-mst)"/>
<text x="390.0" y="497" class="ml" fill="#7a4bc2" text-anchor="middle"></text>
<line x1="610" y1="557" x2="178" y2="557" stroke="#7a4bc2" stroke-width="1.8" marker-end="url(#a-mst)"/>
<text x="390.0" y="549" class="ml" fill="#7a4bc2" text-anchor="middle">MEMBER_LIST (and the others' NODE_ASSIGNs)</text>
<text x="390.0" y="573" class="ms" fill="#4b5563" text-anchor="middle">unicast, session key</text>
<rect x="30" y="587" width="300" height="90" rx="7" fill="#ffffff" stroke="#111827" stroke-width="2.0"/>
<text x="39" y="605" class="bt" fill="#111827" text-anchor="start">ACTIVE · CONNECTING</text>
<text x="39" y="626" class="b" text-anchor="start">No role, no sharing tag. It follows</text>
<text x="39" y="643" class="b" text-anchor="start">the master that granted its key - no</text>
<text x="39" y="660" class="b" text-anchor="start">election of its own for 4 s.</text>
<line x1="170" y1="725" x2="1032" y2="725" stroke="#c9781b" stroke-width="1.8" marker-start="url(#s-bin)" marker-end="url(#a-bin)"/>
<text x="605.0" y="717" class="ml" fill="#c9781b" text-anchor="middle">BIN links probed both ways, to and from every member</text>
<text x="605.0" y="741" class="ms" fill="#4b5563" text-anchor="middle">TCP</text>
<line x1="170" y1="769" x2="1032" y2="769" stroke="#3b6fd8" stroke-width="1.8" marker-end="url(#a-ctl)"/>
<text x="605.0" y="761" class="ml" fill="#3b6fd8" text-anchor="middle">ALIVE every second: the nodes it has a link up with</text>
<text x="605.0" y="785" class="ms" fill="#4b5563" text-anchor="middle">multicast, session key - every member sends one</text>
<line x1="610" y1="841" x2="1032" y2="841" stroke="#7a4bc2" stroke-width="1.8" marker-end="url(#a-mst)"/>
<text x="825.0" y="818" class="ml" fill="#7a4bc2" text-anchor="middle">MASTER_ALIVE every second: the CONNECTING bitmap,</text>
<text x="825.0" y="833" class="ml" fill="#7a4bc2" text-anchor="middle">the joiner in it</text>
<text x="825.0" y="857" class="ms" fill="#4b5563" text-anchor="middle">multicast, session key</text>
<line x1="610" y1="841" x2="178" y2="841" stroke="#7a4bc2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-mst)"/>
<text x="390.0" y="833" class="ml" fill="#7a4bc2" text-anchor="middle"></text>
<rect x="410" y="871" width="400" height="141" rx="7" fill="#fdeaea" stroke="#c43c3c" stroke-width="1.3"/>
<text x="419" y="889" class="bt" fill="#c43c3c" text-anchor="start">The master, each second</text>
<text x="419" y="910" class="b" text-anchor="start">Is every pair between the joiner and the members up</text>
<text x="419" y="927" class="b" text-anchor="start">both ways, by their ALIVEs? After 10 s: stuck - a</text>
<text x="419" y="944" class="b" text-anchor="start">warning naming the pairs down, E_CL_CTR_ADMISSION,</text>
<text x="419" y="961" class="b" text-anchor="start">admissions_stuck, and the queue holds. After 60 s:</text>
<text x="419" y="978" class="b" text-anchor="start">parked - the queue moves past it (at most 2</text>
<text x="419" y="995" class="b" text-anchor="start">parked).</text>
<line x1="610" y1="1058" x2="1032" y2="1058" stroke="#7a4bc2" stroke-width="1.8" marker-end="url(#a-mst)"/>
<text x="825.0" y="1050" class="ml" fill="#7a4bc2" text-anchor="middle">MASTER_ALIVE: the joiner is no longer CONNECTING</text>
<text x="825.0" y="1074" class="ms" fill="#4b5563" text-anchor="middle">multicast, session key</text>
<line x1="610" y1="1058" x2="178" y2="1058" stroke="#7a4bc2" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#a-mst)"/>
<text x="390.0" y="1050" class="ml" fill="#7a4bc2" text-anchor="middle"></text>
<rect x="30" y="1088" width="300" height="90" rx="7" fill="#ffffff" stroke="#111827" stroke-width="2.0"/>
<text x="39" y="1106" class="bt" fill="#111827" text-anchor="start">ACTIVE · ONLINE</text>
<text x="39" y="1127" class="b" text-anchor="start">May be master or backup and hold</text>
<text x="39" y="1144" class="b" text-anchor="start">sharing tags. Every capability that</text>
<text x="39" y="1161" class="b" text-anchor="start">syncs at startup syncs again.</text>
<rect x="890" y="1088" width="300" height="90" rx="7" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.3"/>
<text x="899" y="1106" class="bt" fill="#6b7280" text-anchor="start">To their modules</text>
<text x="899" y="1127" class="b" text-anchor="start">The joiner is up (NODE_UP) while its</text>
<text x="899" y="1144" class="b" text-anchor="start">ALIVEs arrive and the link to it is</text>
<text x="899" y="1161" class="b" text-anchor="start">up.</text>
<rect x="480" y="1088" width="260" height="73" rx="7" fill="#f1eafb" stroke="#7a4bc2" stroke-width="1.3"/>
<text x="489" y="1106" class="bt" fill="#7a4bc2" text-anchor="start">The queue</text>
<text x="489" y="1127" class="b" text-anchor="start">The next joiner in the queue is</text>
<text x="489" y="1144" class="b" text-anchor="start">admitted.</text>
</svg>
