log_level = 2
stderror_enabled = yes
syslog_enabled = no

mpath = "modules/" : "modules-contrib/"

socket = udp:127.0.0.1:5059
socket = bin:127.0.0.1:5599

loadmodule "proto_udp.so"
loadmodule "proto_bin.so"
loadmodule "clusterer_controller.so"

modparam("clusterer", "db_mode", 0)
modparam("clusterer", "cluster_options", "cluster_id=1, use_controller=1")

modparam("clusterer", "my_ip", "127.0.0.1")
modparam("clusterer", "password", "unit-tests-only-not-a-secret")
modparam("clusterer", "cluster", "id=1,multicast=239.0.99.1:3999,bin_socket=bin:127.0.0.1:5599")
