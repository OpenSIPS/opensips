log_level = 3
stderror_enabled = yes
syslog_enabled = no

udp_workers = 1
auto_aliases = no
socket = udp:localhost:5059

mpath = "modules/":"modules-contrib/"

loadmodule "proto_udp.so"
loadmodule "nats.so"
# nats_consumer alone, without event_nats or cachedb_nats: it registers the
# pool itself.  Nothing listens on the port, so the suite runs degraded.
loadmodule "nats_consumer.so"
modparam("nats_consumer", "nats_url", "nats://127.0.0.1:14222")
modparam("nats_consumer", "bind", "id=ut_bind;stream=UT_STREAM;durable=ut_durable")
# Below the floor: slot init clamps it to a pool of one slot, which the
# slot tests rely on.
modparam("nats_consumer", "async_rpc_slots", 0)

route {
	exit;
}
