log_level = 3
stderror_enabled = yes
syslog_enabled = no

udp_workers = 1
auto_aliases = no
socket = udp:localhost:5059

mpath = "modules/":"modules-contrib/"

loadmodule "proto_udp.so"
loadmodule "nats.so"
loadmodule "event_nats.so"

# no server listens here: the module starts degraded and the tests put a
# fake libnats in its place
modparam("event_nats", "nats_url", "nats://127.0.0.1:14222")

# settings of the shared connection given to this module: they must reach
# the nats module (test_shared_params.c)
modparam("event_nats", "no_randomize", 1)
modparam("event_nats", "reconnect_buf_size", 123456)
modparam("event_nats", "drain_timeout_ms", 1500)
modparam("event_nats", "js_ack_timeout_ms", 900)
modparam("event_nats", "js_publish_retries", 2)
modparam("event_nats", "user", "ut-user")
modparam("event_nats", "password", "ut-pa55word")

# test_publish.c
modparam("event_nats", "msg_id", "E_NATS_UT_PUB: call_id, seq")

# test_inbound.c, test_subscription.c
modparam("event_nats", "subscribe", "subject=ut.events.>;event=E_NATS_UT")
modparam("event_nats", "subscribe", "subject=ut.work;event=E_NATS_UT_Q;queue=workers")

route {
	exit;
}
