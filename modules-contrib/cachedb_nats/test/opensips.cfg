log_level = 3
stderror_enabled = yes
syslog_enabled = no

udp_workers = 1
auto_aliases = no
socket = udp:localhost:5059

mpath = "modules/":"modules-contrib/"

loadmodule "proto_udp.so"
loadmodule "nats.so"
loadmodule "cachedb_nats.so"
modparam("cachedb_nats", "cachedb_url", "nats:loc://127.0.0.1:14222/")
modparam("cachedb_nats", "kv_bucket", "unit_tests")

route {
	exit;
}
