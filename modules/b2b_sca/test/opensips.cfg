log_level = 2
stderror_enabled=yes
syslog_enabled=no

udp_workers = 1

socket = udp:localhost:5059

####### Modules Section ########

mpath = "modules/"

loadmodule "proto_udp.so"
loadmodule "mi_fifo.so"
loadmodule "db_text.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "pua.so"
loadmodule "b2b_entities.so"
loadmodule "b2b_logic.so"
loadmodule "b2b_sca.so"

# the tests run from the source tree root
modparam("pua", "db_url", "text:///proc/self/cwd/modules/b2b_sca/test/db")
modparam("b2b_entities", "db_mode", 0)
modparam("b2b_logic", "db_mode", 0)
modparam("b2b_sca", "db_url", "text:///proc/self/cwd/modules/b2b_sca/test/db")
modparam("b2b_sca", "db_mode", 0)

route {
	exit;
}
