# debug level, so that the user map dump runs on every change
log_level = 4
stderror_enabled = yes
syslog_enabled = no

mpath = "modules/"

socket = udp:127.0.0.1:5059
socket = ipsec:127.0.0.1:5100
socket = ipsec:127.0.0.1:5101

loadmodule "proto_udp.so"
loadmodule "proto_tcp.so"
loadmodule "signaling.so"
loadmodule "sl.so"
loadmodule "tm.so"
loadmodule "usrloc.so"
loadmodule "proto_ipsec.so"

route {
    exit;
}
