#
# OpenSIPS dialog-less topology hiding, with the state kept in Redis
#
# Please refer to the OpenSIPS Manuals at:
#      https://docs.opensips.org/manual/devel/
# for an explanation of available statements, functions and parameters.
#


####### Global Parameters #########

log_level=3
xlog_level=3
stderror_enabled=no
syslog_enabled=yes
syslog_facility=LOG_LOCAL0

udp_workers=4

socket=udp:127.0.0.1:5060   # CUSTOMIZE ME



####### Modules Section ########

#set module path
mpath="/usr/local/lib/opensips/modules/"

#### SIGNALING module
loadmodule "signaling.so"

#### StateLess module
loadmodule "sl.so"

#### Transaction Module
loadmodule "tm.so"

#### Record Route Module
loadmodule "rr.so"

#### MAX ForWarD module
loadmodule "maxfwd.so"

#### SIP MSG OPerationS module
loadmodule "sipmsgops.so"

#### Redis cachedb backend, holding the topology hiding states
loadmodule "cachedb_redis.so"

#### Topology Hiding module
loadmodule "topology_hiding.so"
/* "S": only a 17 characters key travels in the Contact, the state itself
   is stored in th_state_url */
modparam("topology_hiding", "th_contact_encode_param_password",
	"thinfo:CHANGE_ME:S")   # CUSTOMIZE ME
modparam("topology_hiding", "th_state_url",
	"redis:th://127.0.0.1:6379/")   # CUSTOMIZE ME
/* nothing is ever routed to the Contact of an OPTIONS keepalive */
modparam("topology_hiding", "th_state_options", 0)

loadmodule "proto_udp.so"


####### Routing Logic ########

# main request routing logic

route{

	if (!mf_process_maxfwd_header(10)) {
		send_reply(483,"Too Many Hops");
		exit;
	}

	if (has_totag()) {
		# sequential requests are routed by the state their R-URI
		# points to, whether it was stored or came inline
		if (topology_hiding_match()) {
			t_relay();
			exit;
		}

		# handle hop-by-hop ACK (no routing required)
		if ( is_method("ACK") && t_check_trans() ) {
			t_relay();
			exit;
		}

		# unknown or expired state
		send_reply(404,"Not here");
		exit;
	}

	# CANCEL processing
	if (is_method("CANCEL")) {
		if (t_check_trans())
			t_relay();
		exit;
	}

	# absorb retransmissions, but do not create transaction
	t_check_trans();

	# no dialog is created, so any method gets the dialog-less hiding,
	# SUBSCRIBE included
	topology_hiding();

	if (!t_relay())
		send_reply(500,"Internal Error");
	exit;
}
