log_level = 2
stderror_enabled=yes
syslog_enabled=no

udp_workers = 1

auto_aliases = no
enable_asserts = true
abort_on_assert = true

socket = udp:localhost:5059

####### Modules Section ########

mpath = "modules/"

loadmodule "proto_udp.so"
loadmodule "mi_fifo.so"
loadmodule "sip_i.so"

route {
	exit;
}
