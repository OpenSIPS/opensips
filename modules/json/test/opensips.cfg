log_level = 2
stderror_enabled = yes
syslog_enabled = no

enable_asserts = true
abort_on_assert = true

mpath = "modules/"
loadmodule "json.so"

socket = udp:localhost:5059

loadmodule "proto_udp.so"

startup_route {
    $json(test) := "{\"true_value\": true, \"false_value\": false}";

    assert($json(test/true_value) == true, "json boolean true equals true");
    assert($json(test/true_value) == 1, "json boolean true equals 1");
    assert($json(test/true_value), "json boolean true is truthy");

    assert($json(test/false_value) == false, "json boolean false equals false");
    assert($json(test/false_value) == 0, "json boolean false equals 0");
    assert(!$json(test/false_value), "json boolean false is falsey");

    # backwards-compatibility check: string comparisons
    assert($json(test/true_value) == "true", "json string comparison equals 'true'");
    assert($json(test/false_value) == "false", "json string comparison equals 'false'");

    $json(output) := '{}';
    $json(output/true_value) = $json_true;
    $json(output/false_value) = $json_false;
    $json(output/int_true) = 1;
    $json(output/int_false) = 0;

    assert($json_compact(output) == '{"true_value":true,"false_value":false,"int_true":1,"int_false":0}',
        "json boolean constants preserve their JSON type");

    $json(converted) := '{}';
    assert($(json(test/true_value){i.bool}) == 1,
        "integer boolean transformation converts true to 1");
    assert($(json(test/false_value){i.bool}) == 0,
        "integer boolean transformation converts false to 0");
    $json(converted/from_true) = $(json(test/true_value){i.bool});
    $json(converted/from_false) = $(json(test/false_value){i.bool});

    $var(nonzero) = -42;
    assert($(var(nonzero){i.bool}) == 1,
        "integer boolean transformation normalizes non-zero values");
    $json(converted/nonzero) = $(var(nonzero){i.bool});
    $var(zero) = 0;
    $json(converted/zero) = $(var(zero){i.bool});

    $var(string_true) = "7";
    assert($(var(string_true){i.bool}) == NULL,
        "integer boolean transformation rejects numeric strings");
    assert($(var(string_true){s.int}{i.bool}) == 1,
        "integer boolean transformation supports explicit string conversion");
    $json(converted/string_true) = $(var(string_true){s.int}{i.bool});

    $var(invalid) = "true";
    assert($(var(invalid){i.bool}) == NULL,
        "integer boolean transformation rejects non-integer values");
    $var(null_value) = NULL;
    assert($(var(null_value){i.bool}) == NULL,
        "integer boolean transformation preserves NULL");

    assert($json_compact(converted) == '{"from_true":true,"from_false":false,"nonzero":true,"zero":false,"string_true":true}',
        "integer boolean transformation preserves JSON boolean types");
}

route {
    exit;
}
