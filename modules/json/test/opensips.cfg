log_level = 2
stderror_enabled = yes
syslog_enabled = no

enable_asserts = true
abort_on_assert = true

mpath = "modules/"
loadmodule "json.so"
loadmodule "cfgutils.so"

socket = udp:localhost:5059

loadmodule "proto_udp.so"

startup_route {
    $json(test) := "{\"true_value\": true, \"false_value\": false}";

    assert($json(test/true_value) == true, "json boolean true equals true");
    assert($json(test/true_value) == 1, "json boolean true equals 1");
    assert($json(test/true_value), "json boolean true is truthy");

    assert($json(test/false_value) == false, "json boolean false equals false");
    assert($json(test/false_value) == 0, "json boolean false equals 0");
    assert(!$json(test/false_value), "json boolean false is falsey");

    # backwards-compatibility check: string comparisons
    assert($json(test/true_value) == "true", "json string comparison equals 'true'");
    assert($json(test/false_value) == "false", "json string comparison equals 'false'");

    $json(output) := '{}';
    $json(output/true_value) = $json_true;
    $json(output/false_value) = $json_false;
    $json(output/int_true) = 1;
    $json(output/int_false) = 0;

    assert($json_compact(output) == '{"true_value":true,"false_value":false,"int_true":1,"int_false":0}',
        "json boolean constants preserve their JSON type");

    $json(copied) := '{}';
    $json(copied/true_value) = $json(test/true_value);
    $json(copied/false_value) = $json(test/false_value);
    $avp(copied_true) = $json(test/true_value);
    $avp(copied_false) = $json(test/false_value);
    $var(copied_true) = $json(test/true_value);
    $var(copied_false) = $json(test/false_value);
    $shv(copied_true) = $json(test/true_value);
    $shv(copied_false) = $json(test/false_value);

    assert($json_compact(copied) == '{"true_value":true,"false_value":false}',
        "json-to-json assignments preserve boolean types");
    assert($json(copied/true_value) == "true",
        "copied json boolean true retains its string representation");
    assert($json(copied/false_value) == "false",
        "copied json boolean false retains its string representation");
    assert($avp(copied_true) == "true",
        "copied avp boolean true retains its string representation");
    assert($avp(copied_false) == "false",
        "copied avp boolean false retains its string representation");
    assert($avp(copied_true),
        "copied avp boolean true retains its truth value");
    assert(!$avp(copied_false),
        "copied avp boolean false retains its truth value");
    assert($var(copied_true) == "true",
        "copied variable boolean true retains its string representation");
    assert($var(copied_false) == "false",
        "copied variable boolean false retains its string representation");
    assert($var(copied_true),
        "copied variable boolean true retains its truth value");
    assert(!$var(copied_false),
        "copied variable boolean false retains its truth value");
    assert($shv(copied_true) == "true",
        "copied shared variable boolean true retains its string representation");
    assert($shv(copied_false) == "false",
        "copied shared variable boolean false retains its string representation");
    assert($shv(copied_true),
        "copied shared variable boolean true retains its truth value");
    assert(!$shv(copied_false),
        "copied shared variable boolean false retains its truth value");

    $json(copied_from_avp) := '{}';
    $json(copied_from_avp/true_value) = $avp(copied_true);
    $json(copied_from_avp/false_value) = $avp(copied_false);
    assert($json_compact(copied_from_avp) == '{"true_value":true,"false_value":false}',
        "avp-to-json assignments preserve boolean types");

    $json(copied_from_var) := '{}';
    $json(copied_from_var/true_value) = $var(copied_true);
    $json(copied_from_var/false_value) = $var(copied_false);
    assert($json_compact(copied_from_var) == '{"true_value":true,"false_value":false}',
        "variable-to-json assignments preserve boolean types");

    $json(copied_from_shv) := '{}';
    $json(copied_from_shv/true_value) = $shv(copied_true);
    $json(copied_from_shv/false_value) = $shv(copied_false);
    assert($json_compact(copied_from_shv) == '{"true_value":true,"false_value":false}',
        "shared-variable-to-json assignments preserve boolean types");

    $json(arithmetic) := '{}';
    $json(arithmetic/sum) = $json(test/true_value) + $json(test/true_value);
    $var(compound_sum) = 1;
    $var(compound_sum) += $json(test/true_value);
    $json(arithmetic/compound_sum) = $var(compound_sum);
    assert($json_compact(arithmetic) == '{"sum":2,"compound_sum":2}',
        "arithmetic operations clear boolean types");

    $json(converted) := '{}';
    assert($(json(test/true_value){i.bool}) == 1,
        "integer boolean transformation converts true to 1");
    assert($(json(test/false_value){i.bool}) == 0,
        "integer boolean transformation converts false to 0");
    $json(converted/from_true) = $(json(test/true_value){i.bool});
    $json(converted/from_false) = $(json(test/false_value){i.bool});

    $var(nonzero) = -42;
    assert($(var(nonzero){i.bool}) == 1,
        "integer boolean transformation normalizes non-zero values");
    $json(converted/nonzero) = $(var(nonzero){i.bool});
    $var(zero) = 0;
    $json(converted/zero) = $(var(zero){i.bool});

    $var(string_true) = "7";
    assert($(var(string_true){i.bool}) == NULL,
        "integer boolean transformation rejects numeric strings");
    assert($(var(string_true){s.int}{i.bool}) == 1,
        "integer boolean transformation supports explicit string conversion");
    $json(converted/string_true) = $(var(string_true){s.int}{i.bool});

    $var(invalid) = "true";
    assert($(var(invalid){i.bool}) == NULL,
        "integer boolean transformation rejects non-integer values");
    $var(null_value) = NULL;
    assert($(var(null_value){i.bool}) == NULL,
        "integer boolean transformation preserves NULL");

    assert($json_compact(converted) == '{"from_true":true,"from_false":false,"nonzero":true,"zero":false,"string_true":true}',
        "integer boolean transformation preserves JSON boolean types");
}

route {
    exit;
}
