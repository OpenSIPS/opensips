log_level = 2
stderror_enabled=yes
syslog_enabled=no

#memdump = 2
# one receiver: the suite never reads from the socket, and >1 worker binds a
# SO_REUSEPORT group, which needs SO_ATTACH_REUSEPORT_CBPF (absent under qemu)
udp_workers = 1

auto_aliases = no
enable_asserts = true
abort_on_assert = true
max_while_loops = 10000

socket = udp:localhost:5059

####### Modules Section ########

mpath = "modules/"

loadmodule "proto_udp.so"
loadmodule "mi_fifo.so"

################################

loadmodule "tm.so"
modparam("tm", "auto_100trying", 0)

loadmodule "signaling.so"
loadmodule "acc.so"

loadmodule "usrloc.so"

route {
	exit;
}
