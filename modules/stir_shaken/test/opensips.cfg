log_level = 2
stderror_enabled = yes
syslog_enabled = no

udp_workers = 1
auto_aliases = no
socket = udp:localhost:5059

mpath = "modules/"

loadmodule "proto_udp.so"
loadmodule "stir_shaken.so"

route {
	# Exercise command export/fixup, omitted optional arguments and booleans.
	if (false) {
		$var(i) = $identity(count);
		$var(url) = $(identity(x5u)[0]);
		$var(ppt) = $(identity(ppt)[$var(i)]);
		$var(state) = $identity(chain_status);
		stir_shaken_verify_passport($var(i), $var(cert), $var(code), $var(reason));
		stir_shaken_verify_chain($var(code), $var(reason));
		stir_shaken_verify_chain($var(code), $var(reason), , , -1);
		stir_shaken_verify_chain($var(code), $var(reason), , , , 10800);
		stir_shaken_set_verstat("both", "TN-Validation-Passed");
		stir_shaken_remove_verstat("both");
		stir_shaken_auth_div($var(cert), $var(key), "https://cert.example.test/cert.pem");
		stir_shaken_auth_div($var(cert), $var(key), "https://cert.example.test/cert.pem",
			, , , "$var(div_header)", true);
		stir_shaken_auth_div($var(cert), $var(key), "https://cert.example.test/cert.pem",
			, , , , false);
		$var(previously_verified) = NULL;
		stir_shaken_auth_div($var(cert), $var(key), "https://cert.example.test/cert.pem",
			, , , , $var(previously_verified));
	}
	exit;
}

# Example endpoint policy: attestation is not conveyed separately.
# Invoked by the C tests after actual per-token and complete-chain verification.
route [TEST_VERSTAT_POLICY] {
	if ($identity(chain_status) == "no-validation")
		stir_shaken_set_verstat("from", "No-TN-Validation");
	else if ($identity(chain_status) == "passed") {
		if ($identity(chain_attest) == "A")
			stir_shaken_set_verstat("from", "TN-Validation-Passed");
		else
			stir_shaken_set_verstat("from", "No-TN-Validation");
	} else
		stir_shaken_set_verstat("from", "TN-Validation-Failed");
}
