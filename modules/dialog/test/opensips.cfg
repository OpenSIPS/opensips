log_level = 2
stderror_enabled = yes
syslog_enabled = no

# one receiver: the suite never reads from the socket, and >1 worker binds a
# SO_REUSEPORT group, which needs SO_ATTACH_REUSEPORT_CBPF (absent under qemu)
udp_workers = 1

mpath = "modules/"

socket = udp:localhost:5059

loadmodule "proto_udp.so"
loadmodule "tm.so"
loadmodule "dialog.so"

route {
	exit;
}
