log_level = 2
stderror_enabled=yes
syslog_enabled=no

udp_workers = 1

auto_aliases = no
enable_asserts = true
abort_on_assert = true

socket = udp:localhost:5059
socket = hep_udp:localhost:9061

####### Modules Section ########

mpath = "modules/"

loadmodule "proto_udp.so"
loadmodule "mi_fifo.so"
loadmodule "db_text.so"

loadmodule "proto_hep.so"
modparam("proto_hep", "homer5_on", 0)
loadmodule "sipcapture.so"
modparam("sipcapture", "hep_capture_on", 1)
modparam("sipcapture", "hep_route", "hep")
modparam("sipcapture", "db_url", "text:///tmp")

route {
	exit;
}

route[hep] {
	exit;
}
