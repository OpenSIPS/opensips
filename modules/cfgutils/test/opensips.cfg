log_level = 2
stderror_enabled=yes
syslog_enabled=no

enable_asserts = true
abort_on_assert = true

udp_workers = 1

socket = udp:*:5060

####### Modules Section ########

mpath = "modules/"

loadmodule "mi_fifo.so"
loadmodule "proto_udp.so"

loadmodule "cfgutils.so"

startup_route {
	$var(bool_true) = 1;
	$var(bool_false) = 0;
	$shv(bool_true) = $(var(bool_true){i.bool});
	$shv(bool_false) = $(var(bool_false){i.bool});

	assert($shv(bool_true) == "true",
		"shared variable boolean true retains its string representation");
	assert($shv(bool_false) == "false",
		"shared variable boolean false retains its string representation");
	assert($shv(bool_true),
		"shared variable boolean true retains its truth value");
	assert(!$shv(bool_false),
		"shared variable boolean false retains its truth value");
	$avp(bool_true) = $shv(bool_true);
	$avp(bool_false) = $shv(bool_false);
	assert($avp(bool_true) == "true" && $avp(bool_false) == "false",
		"shared variables retain their boolean type on assignment");

	$shv(bool_true) = 7;
	assert($shv(bool_true) == "7",
		"integer assignment clears the shared variable boolean type");
}
